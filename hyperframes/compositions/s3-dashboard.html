    (function () {
      const S = 69.8;
      const at = (abs) => +(abs - S).toFixed(2);

      // ---- PLAN G (69.84 – 99.6) ----

      tl.set(["#s3-needleN", "#s3-legN"], { opacity: 0 }, 0);

      panelIn("#s3-pB", 73.38); // "comprehensive"

      const c = { v: 0 };
      tl.fromTo(c, { v: 0 }, { v: 100, duration: 1.0, ease: "power2.out", onUpdate: () => (document.querySelector("#s3-mpct").textContent = Math.round(c.v)) }, at(84.02));
      // the padlock slams shut on "100%"
      tl.fromTo("#s3-lock", { opacity: 0, scale: 1.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, at(84.2));
      tl.fromTo("#s3-shackle", { y: -10 }, { y: 0, duration: 0.18, ease: "power4.in" }, at(84.5));
      tl.fromTo("#s3-capG", { opacity: 0, x: 10 }, { opacity: 1, x: 0, duration: 0.35 }, at(84.6));
      pop("#s3-mt1", 89.72); // "including Part B excess charges"
      pop("#s3-mt3", 92.66); // "separate Part D drug plan"
      pop("#s3-mt2", 97.12); // "zero routine doctor copays"
      tl.to("#s3-pM", { opacity: 0, y: 20, duration: 0.35, ease: "power2.in" }, at(99.3));

      // ---- PLAN N (99.62 – 132.3) ----
      // "lower monthly premium" — Plan N needle swings in below Plan G's
      tl.fromTo(["#s3-needleN", "#s3-legN"], { opacity: 0 }, { opacity: 1, duration: 0.2 }, at(102.7));
      tl.fromTo("#s3-needleN", { rotation: 150, svgOrigin: "170 178" }, { rotation: 92, svgOrigin: "170 178", duration: 0.9, ease: "back.out(1.6)" }, at(102.82));
      tl.fromTo("#s3-pA", { borderColor: "rgba(255,255,255,0.1)" }, { borderColor: "#5b8def", duration: 0.3, yoyo: true, repeat: 1 }, at(103.2));

      // "three specific trade-offs" — scale appears, balanced
      panelIn("#s3-pC", 104.72);
      tl.set(".s3-rc", { opacity: 0 }, 0);
      tl.set(["#s3-savings", "#s3-verdict"], { opacity: 0 }, 0);
      tl.fromTo("#s3-rowN", { opacity: 0 }, { opacity: 1, duration: 0.3 }, at(107.16)); // "Just like Plan G..."
      tl.set(["#s3-coin1", "#s3-coin2", "#s3-coin3"], { opacity: 0 }, at(107.1));

      // Each trade-off drops a coin in Dial 2 and onto the right pan; the beam tips right.
      const R = 300; // half beam length
      const tilt = (deg, abs, d = 0.6) => {
        const dy = R * Math.sin((deg * Math.PI) / 180);
        tl.to("#s3-beam", { rotation: deg, svgOrigin: "374 119", duration: d, ease: "back.out(1.3)" }, at(abs));
        tl.to("#s3-panL", { y: -dy, duration: d, ease: "back.out(1.3)" }, at(abs));
        tl.to("#s3-panR", { y: dy, duration: d, ease: "back.out(1.3)" }, at(abs));
      };
      tl.fromTo("#s3-coin1", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.4, ease: "bounce.out" }, at(111.72)); // "$20"
      pop("#s3-rc1", 111.9);
      tilt(2.5, 112.0);
      tl.fromTo("#s3-coin2", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.4, ease: "bounce.out" }, at(114.28)); // "$50"
      pop("#s3-rc2", 114.46);
      tilt(5, 114.56);
      tl.fromTo("#s3-coin3", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.4, ease: "bounce.out" }, at(120.26)); // "does not cover ... excess charges"
      pop("#s3-rc3", 120.44);
      tilt(7, 120.54);
      tl.fromTo("#s3-coin3", { scale: 1 }, { scale: 0.86, duration: 0.25, ease: "power2.out" }, at(122.72)); // "fewer than 2%" — shrinks: small risk

      // "As a rule of thumb ... $60–$100 a month" — savings stack lands, beam tips green
      tl.fromTo("#s3-savings", { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.5, ease: "bounce.out" }, at(129.0));
      tilt(-6, 129.44, 0.8);
      tl.fromTo("#s3-verdict", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, at(129.8));
      tl.fromTo("#s3-pC", { borderColor: "rgba(255,255,255,0.1)" }, { borderColor: "#3dbe7a", duration: 0.4 }, at(129.8));

      tl.to(".s3-stage", { opacity: 0, duration: 0.35, ease: "power2.in" }, at(131.9));
      window.__timelines["s3"] = tl;
